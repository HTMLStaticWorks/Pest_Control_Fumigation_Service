<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D655E" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Shield Shape -->
  <path d="M256 32 C340 64 420 68 448 80 C454 180 448 310 256 480 C64 310 58 180 64 80 C92 68 172 64 256 32 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Inner Border Ring -->
  <path d="M256 56 C326 84 394 88 418 98 C423 182 417 296 256 444 C95 296 89 182 94 98 C118 88 186 84 256 56 Z" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8"/>
  
  <!-- Glowing Checkmark / Medical Icon -->
  <path d="M208 320 L152 264 L180 236 L208 264 L332 140 L360 168 Z" 
        fill="url(#checkGrad)"/>
</svg>
